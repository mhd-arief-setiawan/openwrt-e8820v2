name: Build OpenWrt for ZTE E8820V2

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Clone OpenWrt v23.05.6
        run: git clone --depth 1 --branch v23.05.6 https://github.com/openwrt/openwrt.git openwrt

      - name: Apply E8820V2 device patch
        run: |
          chmod +x apply-patch.sh
          ./apply-patch.sh openwrt

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Cache ccache (speeds up re-runs)
        uses: actions/cache@v4
        with:
          path: openwrt/.ccache
          key: ccache-2305-${{ hashFiles('config.seed') }}
          restore-keys: |
            ccache-2305-

      - name: Configure
        run: |
          cp config.seed openwrt/.config
          echo 'CONFIG_CCACHE=y' >> openwrt/.config
          cd openwrt
          make defconfig
          grep CONFIG_TARGET_ramips_mt7621_DEVICE_zte_e8820v2=y .config

      - name: Download sources
        working-directory: openwrt
        run: make download -j8 || make download -j1 V=s

      - name: Build
        working-directory: openwrt
        run: make -j$(nproc) || make -j1 V=s

      - name: List output
        run: ls -la openwrt/bin/targets/ramips/mt7621/

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-23.05.6-zte-e8820v2-5g
          path: |
            openwrt/bin/targets/ramips/mt7621/*.bin
            openwrt/bin/targets/ramips/mt7621/*.manifest
            openwrt/bin/targets/ramips/mt7621/sha256sums
            openwrt/bin/targets/ramips/mt7621/config.buildinfo
